version: 2
updates:
  # GitHub Actions drift silently: pinning to @v7 picks up patches but not the
  # next major, which is how all three actions ended up stale enough for one to
  # hit a Node deprecation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    # One PR per ecosystem rather than per package: this project pins the whole
    # Svelte/Vite/Vitest stack together, and CI verifies the combination.
    groups:
      svelte:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
      build-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "typescript"
          - "prettier*"
      tauri:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
