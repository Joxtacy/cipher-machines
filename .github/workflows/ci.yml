name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version pinned here: pnpm/action-setup reads the packageManager
      # field in package.json, so the version stays in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run lint

      - name: Types
        run: pnpm run check

      - name: Tests
        run: pnpm test

      # Catches SvelteKit/adapter-static breakage that unit tests cannot see.
      # The Tauri desktop build is deliberately not run here: it needs a full
      # Rust toolchain and several minutes of compile for a shell that changes
      # far less often than the frontend.
      - name: Web build
        run: pnpm run build
